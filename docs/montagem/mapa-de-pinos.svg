<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 522" width="880" height="522" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect x="1" y="1" width="878" height="520" rx="18" fill="#ffffff" stroke="#d5dde5" stroke-width="2"/><text x="28" y="42" font-size="21" font-weight="700" fill="#1a2330">Mapa de pinos do ESP32-C3</text><text x="28" y="66" font-size="14" fill="#5f6b7a">Cada pino do ESP32-C3 (à esquerda) vai para estes pinos das peças. A cor é a sugestão de fio.</text><rect x="28" y="96" width="836" height="48" rx="14" fill="#fbfcfd"/><circle cx="52" cy="120" r="9" fill="#e53935"/><rect x="70" y="105" width="150" height="30" rx="15" fill="#ffffff" stroke="#e53935" stroke-width="2"/><text x="145" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2330">3V3</text><text x="234" y="125" font-size="13" fill="#5f6b7a">fio vermelho</text><path d="M336 120 h26" stroke="#e53935" stroke-width="4" stroke-linecap="round"/><path d="M358 114 l8 6 l-8 6" fill="none" stroke="#e53935" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="382" y="105" width="102" height="30" rx="15" fill="#e5393514" stroke="#e53935" stroke-width="2"/><text x="433" y="125" text-anchor="middle" font-size="13.5"  fill="#1a2330">Tela · VCC</text><rect x="494" y="105" width="124" height="30" rx="15" fill="#e5393514" stroke="#e53935" stroke-width="2"/><text x="556" y="125" text-anchor="middle" font-size="13.5"  fill="#1a2330">MPU6050 · VCC</text><rect x="628" y="105" width="109" height="30" rx="15" fill="#e5393514" stroke="#e53935" stroke-width="2"/><text x="682.5" y="125" text-anchor="middle" font-size="13.5"  fill="#1a2330">Toque · VCC</text><rect x="28" y="158" width="836" height="48" rx="14" fill="#f7f9fb"/><circle cx="52" cy="182" r="9" fill="#37474f"/><rect x="70" y="167" width="150" height="30" rx="15" fill="#ffffff" stroke="#37474f" stroke-width="2"/><text x="145" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2330">GND</text><text x="234" y="187" font-size="13" fill="#5f6b7a">fio preto</text><path d="M336 182 h26" stroke="#37474f" stroke-width="4" stroke-linecap="round"/><path d="M358 176 l8 6 l-8 6" fill="none" stroke="#37474f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="382" y="167" width="102" height="30" rx="15" fill="#37474f14" stroke="#37474f" stroke-width="2"/><text x="433" y="187" text-anchor="middle" font-size="13.5"  fill="#1a2330">Tela · GND</text><rect x="494" y="167" width="124" height="30" rx="15" fill="#37474f14" stroke="#37474f" stroke-width="2"/><text x="556" y="187" text-anchor="middle" font-size="13.5"  fill="#1a2330">MPU6050 · GND</text><rect x="628" y="167" width="109" height="30" rx="15" fill="#37474f14" stroke="#37474f" stroke-width="2"/><text x="682.5" y="187" text-anchor="middle" font-size="13.5"  fill="#1a2330">Toque · GND</text><rect x="747" y="167" width="102" height="30" rx="15" fill="#37474f14" stroke="#37474f" stroke-width="2"/><text x="798" y="187" text-anchor="middle" font-size="13.5"  fill="#1a2330">Buzzer · −</text><rect x="28" y="220" width="836" height="48" rx="14" fill="#fbfcfd"/><circle cx="52" cy="244" r="9" fill="#1e88e5"/><rect x="70" y="229" width="150" height="30" rx="15" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/><text x="145" y="249" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2330">GPIO8 (SDA)</text><text x="234" y="249" font-size="13" fill="#5f6b7a">fio azul</text><path d="M336 244 h26" stroke="#1e88e5" stroke-width="4" stroke-linecap="round"/><path d="M358 238 l8 6 l-8 6" fill="none" stroke="#1e88e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="382" y="229" width="102" height="30" rx="15" fill="#1e88e514" stroke="#1e88e5" stroke-width="2"/><text x="433" y="249" text-anchor="middle" font-size="13.5"  fill="#1a2330">Tela · SDA</text><rect x="494" y="229" width="124" height="30" rx="15" fill="#1e88e514" stroke="#1e88e5" stroke-width="2"/><text x="556" y="249" text-anchor="middle" font-size="13.5"  fill="#1a2330">MPU6050 · SDA</text><rect x="28" y="282" width="836" height="48" rx="14" fill="#f7f9fb"/><circle cx="52" cy="306" r="9" fill="#f9a825"/><rect x="70" y="291" width="150" height="30" rx="15" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><text x="145" y="311" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2330">GPIO9 (SCL)</text><text x="234" y="311" font-size="13" fill="#5f6b7a">fio amarelo</text><path d="M336 306 h26" stroke="#f9a825" stroke-width="4" stroke-linecap="round"/><path d="M358 300 l8 6 l-8 6" fill="none" stroke="#f9a825" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="382" y="291" width="102" height="30" rx="15" fill="#f9a82514" stroke="#f9a825" stroke-width="2"/><text x="433" y="311" text-anchor="middle" font-size="13.5"  fill="#1a2330">Tela · SCL</text><rect x="494" y="291" width="124" height="30" rx="15" fill="#f9a82514" stroke="#f9a825" stroke-width="2"/><text x="556" y="311" text-anchor="middle" font-size="13.5"  fill="#1a2330">MPU6050 · SCL</text><rect x="28" y="344" width="836" height="48" rx="14" fill="#fbfcfd"/><circle cx="52" cy="368" r="9" fill="#43a047"/><rect x="70" y="353" width="150" height="30" rx="15" fill="#ffffff" stroke="#43a047" stroke-width="2"/><text x="145" y="373" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2330">GPIO10</text><text x="234" y="373" font-size="13" fill="#5f6b7a">fio verde</text><path d="M336 368 h26" stroke="#43a047" stroke-width="4" stroke-linecap="round"/><path d="M358 362 l8 6 l-8 6" fill="none" stroke="#43a047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="382" y="353" width="109" height="30" rx="15" fill="#43a04714" stroke="#43a047" stroke-width="2"/><text x="436.5" y="373" text-anchor="middle" font-size="13.5"  fill="#1a2330">Toque · I/O</text><rect x="28" y="406" width="836" height="48" rx="14" fill="#f7f9fb"/><circle cx="52" cy="430" r="9" fill="#8e24aa"/><rect x="70" y="415" width="150" height="30" rx="15" fill="#ffffff" stroke="#8e24aa" stroke-width="2"/><text x="145" y="435" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2330">GPIO20</text><text x="234" y="435" font-size="13" fill="#5f6b7a">fio roxo</text><path d="M336 430 h26" stroke="#8e24aa" stroke-width="4" stroke-linecap="round"/><path d="M358 424 l8 6 l-8 6" fill="none" stroke="#8e24aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="382" y="415" width="102" height="30" rx="15" fill="#8e24aa14" stroke="#8e24aa" stroke-width="2"/><text x="433" y="435" text-anchor="middle" font-size="13.5"  fill="#1a2330">Buzzer · +</text><text x="28" y="502" font-size="13" fill="#5f6b7a">Tela e MPU6050 usam o mesmo par I2C (SDA/SCL): os dois fios de cada um vão no mesmo pino do ESP32-C3. Tudo funciona em 3,3 V.</text></svg>