xt><ellipse cx="410" cy="128" rx="52" ry="10" fill="#ffe08a" opacity=".9"/><rect x="382" y="114" width="56" height="12" rx="3" fill="#2e7d32" stroke="#1a2330" stroke-width="1.5"/><circle cx="410" cy="120" r="4" fill="#a5d6a7"/><path d="M410 112 L410 70" stroke="#5f6b7a" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M398 82 l12 -14 l12 14" fill="none" stroke="#5f6b7a" stroke-width="2"/><text x="430" y="86" font-size="13" fill="#5f6b7a">toque aqui, por cima</text><path d="M382 124 L170 150" stroke="#5f6b7a" stroke-width="1.5"/><text x="28" y="150" font-size="14" font-weight="600" fill="#1a2330">Toque TTP223 colado</text><text x="28" y="168" font-size="14" font-weight="600" fill="#1a2330">com cola quente</text><text x="28" y="186" font-size="12.5" fill="#5f6b7a">por dentro, no topo (a cabeça),</text><text x="28" y="202" font-size="12.5" fill="#5f6b7a">lado do círculo encostado</text><text x="28" y="218" font-size="12.5" fill="#5f6b7a">no plástico, sem folga</text><rect x="250" y="330" width="320" height="40" rx="10" fill="#eaf2fb" stroke="#1a2330" stroke-width="1.5" stroke-dasharray="5 4"/><text x="410" y="355" text-anchor="middle" font-size="13" fill="#1a2330">ESP32-C3, MPU6050 e buzzer por dentro</text></svg>